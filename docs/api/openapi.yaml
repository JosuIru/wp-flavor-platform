openapi: 3.0.3
info:
  title: Flavor Platform API
  version: 1.0.0
  description: |
    API REST para Flavor Platform - Plataforma modular para comunidades, cooperativas y organizaciones.

    ## Descripcion General

    Flavor Platform proporciona una API REST completa para gestionar sitios comunitarios,
    incluyendo modulos funcionales, Visual Builder Pro para paginas, configuracion de apps
    moviles y notificaciones push.

    ## Autenticacion

    La API soporta dos metodos de autenticacion:

    ### 1. X-VBP-Key (API Key)
    Para automatizacion y acceso programatico. La key se obtiene desde:
    - Panel de administracion: Flavor Platform > Config. VBP
    - WP-CLI: `wp eval "echo flavor_get_vbp_api_key();"`

    ```
    X-VBP-Key: tu-api-key-aqui
    ```

    ### 2. WordPress Cookie Auth
    Para peticiones desde el contexto del navegador con sesion activa de WordPress.

    ## Grupos de Endpoints

    - **Core**: Configuracion del sitio, modulos, temas y sistema
    - **VBP (Visual Builder Pro)**: Creacion y gestion de paginas con bloques
    - **App**: Configuracion de apps moviles Flutter
    - **Modules**: Endpoints especificos por modulo funcional
    - **Notifications**: Notificaciones push y alertas

    ## Respuestas de Error

    Todos los errores siguen el formato estandar:

    ```json
    {
      "code": "error_code",
      "message": "Descripcion del error",
      "data": {
        "status": 400
      }
    }
    ```

  contact:
    name: Flavor Platform
    url: https://github.com/flavor-platform
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: '{protocol}://{host}/wp-json'
    description: WordPress REST API base
    variables:
      protocol:
        default: https
        enum:
          - http
          - https
      host:
        default: tu-sitio.com
        description: Dominio del sitio WordPress

tags:
  - name: core
    description: |
      Endpoints principales del sistema: salud, estado, configuracion global,
      gestion de modulos y temas visuales.
  - name: Modules
    description: |
      API Universal de Modulos (flavor/v1). Permite listar modulos activos,
      obtener informacion detallada y ejecutar acciones de cualquier modulo.
  - name: Module Config
    description: |
      Configuracion UI de modulos para apps moviles. Define layouts, campos,
      acciones, filtros y formularios para renderizado dinamico.
  - name: Client Dashboard
    description: |
      Dashboard del usuario cliente. Estadisticas personales, actividad,
      notificaciones, widgets y preferencias.
  - name: Reputation
    description: |
      Sistema de reputacion y gamificacion. Puntos, niveles, badges,
      leaderboard e historial.
  - name: E2E Encryption
    description: |
      Cifrado extremo a extremo (E2E) para comunicaciones seguras.
      Gestion de claves, dispositivos, sesiones y backups.
  - name: app
    description: |
      Configuracion de apps moviles Flutter: branding, temas, navegacion,
      modulos habilitados y sincronizacion con el sitio web.
  - name: vbp
    description: |
      Visual Builder Pro - API para crear y gestionar paginas con bloques,
      secciones, simbolos reutilizables, design tokens y mas.
  - name: notifications
    description: |
      Sistema de notificaciones push y alertas. Gestion de tokens de dispositivos,
      envio de notificaciones y configuracion de canales.

paths:
  # Paths are defined in separate files for maintainability.
  # See: paths/flavor-v1.yaml for flavor/v1 namespace endpoints
  #
  # To use a single bundled file, run:
  #   npx @redocly/cli bundle openapi.yaml -o openapi-bundled.yaml
  #
  # Or reference paths inline with $ref:
  #   /flavor/v1/modules:
  #     $ref: 'paths/flavor-v1.yaml#/~1flavor~1v1~1modules'

  # Placeholder for inline documentation
  /flavor/v1/modules:
    get:
      summary: List all active modules
      description: Returns a list of all currently active modules in the platform.
      operationId: listModules
      tags:
        - Modules
      responses:
        '200':
          description: List of active modules
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      $ref: '#/components/schemas/Module'
                  total:
                    type: integer
        '429':
          description: Rate limit exceeded

  /flavor/v1/modules/{module_id}:
    get:
      summary: Get module information
      description: Returns detailed information about a specific module.
      operationId: getModuleInfo
      tags:
        - Modules
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Module information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '404':
          $ref: '#/components/responses/NotFound'

  /flavor/v1/modules/{module_id}/actions/{action_name}:
    post:
      summary: Execute module action
      description: Executes a specific action on a module.
      operationId: executeModuleAction
      tags:
        - Modules
      security:
        - VBPKey: []
        - WordPressCookie: []
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: string
        - name: action_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Action executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /flavor/v1/client/dashboard:
    get:
      summary: Get client dashboard
      description: Returns complete dashboard data for the authenticated user.
      operationId: getClientDashboard
      tags:
        - Client Dashboard
      security:
        - VBPKey: []
        - WordPressCookie: []
      parameters:
        - name: include_widgets
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Dashboard data
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flavor/v1/reputation/me:
    get:
      summary: Get my reputation
      description: Returns reputation data for the authenticated user.
      operationId: getMyReputation
      tags:
        - Reputation
      security:
        - VBPKey: []
        - WordPressCookie: []
      responses:
        '200':
          description: User reputation data
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flavor/v1/reputation/leaderboard:
    get:
      summary: Get reputation leaderboard
      description: Returns the reputation leaderboard.
      operationId: getLeaderboard
      tags:
        - Reputation
      parameters:
        - name: periodo
          in: query
          schema:
            type: string
            enum: [total, semana, mes]
            default: total
        - name: limite
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Leaderboard data
        '429':
          description: Rate limit exceeded

  /flavor/v1/e2e/status:
    get:
      summary: Get E2E encryption status
      description: Returns E2E encryption system status.
      operationId: getE2EStatus
      tags:
        - E2E Encryption
      security:
        - VBPKey: []
        - WordPressCookie: []
      responses:
        '200':
          description: E2E status
        '401':
          $ref: '#/components/responses/Unauthorized'

  /flavor/v1/e2e/devices:
    get:
      summary: List E2E devices
      description: Lists all devices with E2E keys for the authenticated user.
      operationId: listE2EDevices
      tags:
        - E2E Encryption
      security:
        - VBPKey: []
        - WordPressCookie: []
      responses:
        '200':
          description: Device list
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    VBPKey:
      type: apiKey
      in: header
      name: X-VBP-Key
      description: |
        API Key para automatizacion externa. Se obtiene desde el panel de
        administracion (Flavor Platform > Config. VBP) o via WP-CLI.
    WordPressCookie:
      type: apiKey
      in: cookie
      name: wordpress_logged_in
      description: |
        Cookie de sesion de WordPress. Se establece automaticamente al
        iniciar sesion en el sitio. Util para peticiones desde el navegador.

  schemas:
    Error:
      type: object
      description: Respuesta de error estandar de WordPress REST API
      required:
        - code
        - message
        - data
      properties:
        code:
          type: string
          description: Codigo de error unico
          example: rest_forbidden
        message:
          type: string
          description: Mensaje descriptivo del error
          example: No tienes permisos para acceder a este recurso.
        data:
          type: object
          properties:
            status:
              type: integer
              description: Codigo de estado HTTP
              example: 403
            params:
              type: object
              description: Parametros adicionales del error
              additionalProperties: true

    Success:
      type: object
      description: Respuesta de exito generica
      required:
        - success
      properties:
        success:
          type: boolean
          description: Indica si la operacion fue exitosa
          example: true
        message:
          type: string
          description: Mensaje descriptivo opcional
          example: Operacion completada correctamente.
        data:
          type: object
          description: Datos adicionales de la respuesta
          additionalProperties: true

    Pagination:
      type: object
      description: Informacion de paginacion para listados
      required:
        - page
        - per_page
        - total
        - total_pages
      properties:
        page:
          type: integer
          description: Pagina actual (1-indexed)
          minimum: 1
          example: 1
        per_page:
          type: integer
          description: Elementos por pagina
          minimum: 1
          maximum: 100
          example: 10
        total:
          type: integer
          description: Total de elementos disponibles
          minimum: 0
          example: 42
        total_pages:
          type: integer
          description: Total de paginas disponibles
          minimum: 0
          example: 5

    PaginatedResponse:
      type: object
      description: Respuesta paginada generica
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          description: Lista de elementos de la pagina actual
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'

    HealthStatus:
      type: object
      description: Estado de salud del sistema
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - error
          description: Estado general del sistema
          example: ok
        version:
          type: string
          description: Version del plugin
          example: 1.0.0
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo de la verificacion
          example: '2026-04-14T12:00:00Z'
        checks:
          type: object
          description: Verificaciones individuales del sistema
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                  - pass
                  - warn
                  - fail
              message:
                type: string

    Module:
      type: object
      description: Informacion de un modulo de Flavor Platform
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
          description: Identificador unico del modulo
          example: eventos
        name:
          type: string
          description: Nombre legible del modulo
          example: Eventos
        description:
          type: string
          description: Descripcion del modulo
          example: Gestion de eventos y calendario comunitario
        active:
          type: boolean
          description: Si el modulo esta activo
          example: true
        category:
          type: string
          description: Categoria del modulo
          example: comunidad
        dependencies:
          type: array
          description: Modulos requeridos para funcionar
          items:
            type: string
          example:
            - socios

  responses:
    BadRequest:
      description: Peticion mal formada o parametros invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_invalid_param
            message: El parametro 'page' debe ser un numero entero positivo.
            data:
              status: 400
              params:
                page: invalid

    Unauthorized:
      description: No autenticado - se requiere autenticacion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_not_logged_in
            message: Debes iniciar sesion para acceder a este recurso.
            data:
              status: 401

    Forbidden:
      description: Sin permisos - autenticado pero sin autorizacion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_forbidden
            message: No tienes permisos para realizar esta accion.
            data:
              status: 403

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_post_invalid_id
            message: El recurso solicitado no existe.
            data:
              status: 404

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: internal_server_error
            message: Ha ocurrido un error interno. Por favor, intentalo de nuevo.
            data:
              status: 500

security:
  - VBPKey: []
  - WordPressCookie: []
