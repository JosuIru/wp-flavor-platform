      '404':
        description: Reserva no encontrada

/admin/stats:
  get:
    tags:
      - Admin
    summary: Estadisticas de admin
    description: Estadisticas detalladas para reportes.
    operationId: getAdminStats
    security:
      - bearerAuth: []
    parameters:
      - name: period
        in: query
        schema:
          type: string
          enum: [day, week, month, year]
          default: week
    responses:
      '200':
        description: Estadisticas
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                stats:
                  type: object

/admin/customers:
  get:
    tags:
      - Admin
    summary: Listar clientes
    description: Lista clientes con sus reservas.
    operationId: getCustomers
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: search
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
    responses:
      '200':
        description: Lista de clientes

/admin/export/csv:
  post:
    tags:
      - Admin
    summary: Exportar datos a CSV
    description: Genera exportacion CSV de reservas, clientes o ingresos.
    operationId: exportCsv
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - type
              - from
              - to
            properties:
              type:
                type: string
                enum: [reservations, customers, revenue]
              from:
                type: string
                format: date
              to:
                type: string
                format: date
              view_only:
                type: boolean
                description: Si true, devuelve datos en JSON en lugar de CSV
              ticket_type:
                type: string
                description: Filtrar por tipo de ticket
    responses:
      '200':
        description: Datos exportados
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                csv:
                  type: string
                  description: Contenido CSV (si view_only=false)
                filename:
                  type: string
                data:
                  type: array
                  description: Datos JSON (si view_only=true)

# -----------------------------------------------------------------------------
# ADMIN - CLIENTES MANUALES
# -----------------------------------------------------------------------------

/admin/manual-customers:
  get:
    tags:
      - Admin Customers
    summary: Listar clientes manuales
    description: Lista clientes agregados manualmente (sin WooCommerce).
    operationId: getManualCustomers
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Lista de clientes manuales

  post:
    tags:
      - Admin Customers
    summary: Crear cliente manual
    description: Agrega un cliente manual con sus tickets.
    operationId: createManualCustomer
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - date
            properties:
              name:
                type: string
              phone:
                type: string
              email:
                type: string
                format: email
              date:
                type: string
                format: date
              notes:
                type: string
              tickets:
                type: array
                items:
                  type: object
                  properties:
                    slug:
                      type: string
                    quantity:
                      type: integer
    responses:
      '200':
        description: Cliente creado
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                id:
                  type: integer
                message:
                  type: string

/admin/manual-customers/{id}:
  put:
    tags:
      - Admin Customers
    summary: Actualizar cliente manual
    description: Actualiza datos de un cliente manual.
    operationId: updateManualCustomer
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              phone:
                type: string
              email:
                type: string
              date:
                type: string
                format: date
              notes:
                type: string
              status:
                type: string
              tickets:
                type: array
                items:
                  type: object
    responses:
      '200':
        description: Cliente actualizado

  delete:
    tags:
      - Admin Customers
    summary: Eliminar cliente manual
    description: Elimina un cliente manual y sus tickets asociados.
    operationId: deleteManualCustomer
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Cliente eliminado

/admin/customer-notes:
  post:
    tags:
      - Admin Customers
    summary: Guardar notas de cliente
    description: Guarda notas para un cliente (manual o WooCommerce).
    operationId: saveCustomerNotes
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - origin
              - notes
            properties:
              origin:
                type: string
                enum: [manual, woocommerce]
              id:
                type: integer
                description: ID del cliente manual (si origin=manual)
              order_id:
                type: integer
                description: ID del pedido WC (si origin=woocommerce)
              date:
                type: string
                format: date
              notes:
                type: string
    responses:
      '200':
        description: Notas guardadas

/admin/unified-customers:
  get:
    tags:
      - Admin Customers
    summary: Clientes unificados
    description: Lista combinada de clientes WooCommerce y manuales.
    operationId: getUnifiedCustomers
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Lista unificada de clientes
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                customers:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      date:
                        type: string
                      tickets:
                        type: array
                        items:
                          type: object
                      origin:
                        type: string
                        enum: [woocommerce, manual]
                total:
                  type: integer

