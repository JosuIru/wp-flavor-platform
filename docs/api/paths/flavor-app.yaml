          application/json:
            schema:
              type: object
              properties:
                statistics:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      value:
                        type: string
                      numeric_value:
                        type: number
                      icon_name:
                        type: string
                      color_hex:
                        type: string
                total:
                  type: integer
                generated_at:
                  type: string
                  format: date-time

/client/activity:
  get:
    tags:
      - Client Dashboard
    summary: Actividad reciente del cliente
    description: Feed de actividad del usuario autenticado.
    operationId: getClientActivity
    security:
      - bearerAuth: []
