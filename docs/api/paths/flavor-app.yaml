# =============================================================================
# Flavor Mobile API - OpenAPI 3.0 Paths
# =============================================================================
# Namespace: /wp-json/chat-ia-mobile/v1/
# Uso: Apps Flutter (cliente y admin)
# =============================================================================

# -----------------------------------------------------------------------------
# INFORMACION DEL SITIO (PUBLICO)
# -----------------------------------------------------------------------------

/site-info:
  get:
    tags:
      - Site Info
    summary: Obtener informacion basica del sitio
    description: |
      Devuelve informacion publica del sitio: nombre, logo, colores,
      configuracion de chat IA, y metadata general para la app movil.
    operationId: getSiteInfo
    responses:
      '200':
        description: Informacion del sitio
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                site:
                  type: object
                  properties:
                    name:
                      type: string
                      example: "Mi Cooperativa"
                    url:
                      type: string
                      format: uri
                    logo:
                      type: string
                      format: uri
                    tagline:
                      type: string
                colors:
                  type: object
                  properties:
                    primary:
                      type: string
                      example: "#2196F3"
                    secondary:
                      type: string
                      example: "#FF9800"
                chat_enabled:
                  type: boolean

/site-content:
  get:
    tags:
      - Site Info
    summary: Obtener contenido inteligente del sitio
    description: |
      Genera contenido automatico basado en paginas y configuracion del sitio.
      Incluye secciones importantes, enlaces rapidos, galeria y noticias.
    operationId: getSiteContent
    responses:
      '200':
        description: Contenido estructurado del sitio
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                site_info:
                  type: object
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      summary:
                        type: string
                      url:
                        type: string
                      icon:
                        type: string
                quick_links:
                  type: array
                  items:
                    type: object
                social:
                  type: array
                  items:
                    type: object
                gallery:
                  type: array
                  items:
                    type: object
                news:
                  type: array
                  items:
                    type: object

/client-app-config:
  get:
    tags:
      - Site Info
    summary: Configuracion completa de la app cliente
    description: |
      Devuelve la configuracion de navegacion, tabs, drawer, colores,
      branding, features habilitadas e info_sections para la app cliente.
      Usado por Flutter para configuracion backend-driven.
    operationId: getClientAppConfig
    responses:
      '200':
        description: Configuracion de la app
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                config:
                  type: object
                  properties:
                    navigation_type:
                      type: string
                      enum: [hybrid, tabs_only, drawer_only]
                    show_appbar:
                      type: boolean
                    tabs:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          label:
                            type: string
                          icon:
                            type: string
                          enabled:
                            type: boolean
                          content_type:
                            type: string
                          content_ref:
                            type: string
                    drawer_items:
                      type: array
                      items:
                        type: object
                    default_tab:
                      type: string
                    features:
                      type: object
                    branding:
                      type: object
                    colors:
                      type: object
                    info_sections:
                      type: array
                      items:
                        type: object
                    quick_actions:
                      type: array
                      items:
                        type: object
                    home_widgets:
                      type: array
                      items:
                        type: object
                    version:
                      type: string
                    cache_duration:
                      type: integer

# -----------------------------------------------------------------------------
# AUTENTICACION
# -----------------------------------------------------------------------------

/auth/login:
  post:
    tags:
      - Authentication
    summary: Iniciar sesion
    description: |
      Autentica un usuario con credenciales de WordPress.
      Devuelve access_token y refresh_token para uso en endpoints protegidos.
    operationId: authLogin
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
                description: Usuario o email de WordPress
              password:
                type: string
                format: password
              device_id:
                type: string
                description: Identificador unico del dispositivo
              platform:
                type: string
                enum: [android, ios]
    responses:
      '200':
        description: Login exitoso
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                token:
                  type: string
                  description: JWT access token
                refresh_token:
                  type: string
                  description: Token para renovar sesion
                expires_in:
                  type: integer
                  description: Segundos hasta expiracion
                user:
                  type: object
                  properties:
                    id:
                      type: integer
                    display_name:
                      type: string
                    email:
                      type: string
                    roles:
                      type: array
                      items:
                        type: string
                    is_admin:
                      type: boolean
      '401':
        description: Credenciales invalidas

/auth/verify:
  get:
    tags:
      - Authentication
    summary: Verificar token de sesion
    description: Verifica que el access_token sea valido y devuelve info del usuario.
    operationId: authVerify
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Token valido
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                user:
                  type: object
      '401':
        description: Token invalido o expirado

/auth/refresh:
  post:
    tags:
      - Authentication
    summary: Renovar access token
    description: Usa el refresh_token para obtener un nuevo access_token sin re-login.
    operationId: authRefresh
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - refresh_token
            properties:
              refresh_token:
                type: string
    responses:
      '200':
        description: Token renovado
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                token:
                  type: string
                expires_in:
                  type: integer
      '401':
        description: Refresh token invalido

# -----------------------------------------------------------------------------
# CHAT IA
# -----------------------------------------------------------------------------

/chat/send:
  post:
    tags:
      - Chat
    summary: Enviar mensaje al chat IA
    description: |
      Envia un mensaje del usuario al asistente IA y recibe la respuesta.
      Funciona tanto para usuarios anonimos como autenticados.
    operationId: chatSend
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
                description: Mensaje del usuario
              session_id:
                type: string
                description: ID de sesion de chat (opcional)
              context:
                type: object
                description: Contexto adicional para el chat
    responses:
      '200':
        description: Respuesta del asistente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                response:
                  type: string
                  description: Respuesta del asistente IA
                session_id:
                  type: string
                escalated:
                  type: boolean
                  description: Indica si se escalo a humano

/chat/session:
  post:
    tags:
      - Chat
    summary: Crear nueva sesion de chat
    description: Inicia una nueva sesion de chat con el asistente IA.
    operationId: chatCreateSession
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              device_id:
                type: string
              platform:
                type: string
    responses:
      '200':
        description: Sesion creada
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                session_id:
                  type: string
                welcome_message:
                  type: string

# -----------------------------------------------------------------------------
# INFORMACION PUBLICA
# -----------------------------------------------------------------------------

/public/business-info:
  get:
    tags:
      - Public
    summary: Informacion del negocio
    description: Devuelve informacion de contacto, horarios y ubicacion del negocio.
    operationId: getBusinessInfo
    responses:
      '200':
        description: Informacion del negocio
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                business:
                  type: object
                  properties:
                    name:
                      type: string
                    phone:
                      type: string
                    email:
                      type: string
                    address:
                      type: string
                    coordinates:
                      type: object
                      properties:
                        lat:
                          type: number
                        lng:
                          type: number
                    hours:
                      type: object
                    social:
                      type: object

/public/availability:
  get:
    tags:
      - Public
    summary: Disponibilidad de fechas
    description: |
      Devuelve fechas con disponibilidad para reservas.
      Incluye aforo disponible por fecha y tipo de ticket.
    operationId: getAvailability
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
        description: Fecha inicio (YYYY-MM-DD)
      - name: to
        in: query
        schema:
          type: string
          format: date
        description: Fecha fin (YYYY-MM-DD)
    responses:
      '200':
        description: Calendario de disponibilidad
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                availability:
                  type: array
                  items:
                    type: object
                    properties:
                      date:
                        type: string
                        format: date
                      available:
                        type: boolean
                      slots:
                        type: integer

/public/tickets:
  get:
    tags:
      - Public
    summary: Tipos de tickets disponibles
    description: Lista los tipos de tickets/entradas configurados con precios y descripciones.
    operationId: getTicketTypes
    responses:
      '200':
        description: Lista de tipos de ticket
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                tickets:
                  type: array
                  items:
                    type: object
                    properties:
                      slug:
                        type: string
                      name:
                        type: string
                      price:
                        type: number
                      description:
                        type: string
                      max_per_order:
                        type: integer

/public/experiences:
  get:
    tags:
      - Public
    summary: Experiencias disponibles
    description: Lista las experiencias o actividades disponibles para reservar.
    operationId: getExperiences
    responses:
      '200':
        description: Lista de experiencias
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                experiences:
                  type: array
                  items:
                    type: object

/public/posts:
  get:
    tags:
      - Public
    summary: Ultimos posts/noticias
    description: Devuelve los posts mas recientes del blog.
    operationId: getLatestPosts
    parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 5
    responses:
      '200':
        description: Lista de posts
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                posts:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      excerpt:
                        type: string
                      date:
                        type: string
                      image:
                        type: string

/public/updates:
  get:
    tags:
      - Public
    summary: Actualizaciones del sitio
    description: Devuelve actualizaciones y novedades recientes del sitio.
    operationId: getSiteUpdates
    responses:
      '200':
        description: Lista de actualizaciones

# -----------------------------------------------------------------------------
# RESERVAS (CLIENTE)
# -----------------------------------------------------------------------------

/reservations/check:
  post:
    tags:
      - Reservations
    summary: Verificar disponibilidad de reserva
    description: Verifica si hay disponibilidad para una fecha y cantidad especifica.
    operationId: checkReservationAvailability
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - date
              - tickets
            properties:
              date:
                type: string
                format: date
              tickets:
                type: array
                items:
                  type: object
                  properties:
                    slug:
                      type: string
                    quantity:
                      type: integer
    responses:
      '200':
        description: Resultado de verificacion
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                available:
                  type: boolean
                message:
                  type: string

/reservations/prepare:
  post:
    tags:
      - Reservations
    summary: Preparar reserva
    description: Prepara una reserva temporal antes de checkout.
    operationId: prepareReservation
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - date
              - tickets
            properties:
              date:
                type: string
                format: date
              tickets:
                type: array
                items:
                  type: object
    responses:
      '200':
        description: Reserva preparada
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                reservation_id:
                  type: string
                total:
                  type: number
                expires_at:
                  type: string

/reservations/add-to-cart:
  post:
    tags:
      - Reservations
    summary: Agregar al carrito
    description: Agrega tickets de reserva al carrito de WooCommerce.
    operationId: addToCart
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - date
              - tickets
            properties:
              date:
                type: string
                format: date
              tickets:
                type: array
                items:
                  type: object
    responses:
      '200':
        description: Tickets agregados al carrito

/reservations/cart-url:
  get:
    tags:
      - Reservations
    summary: Obtener URL del carrito
    description: Devuelve la URL del carrito de WooCommerce.
    operationId: getCartUrl
    responses:
      '200':
        description: URL del carrito
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                cart_url:
                  type: string
                  format: uri
                checkout_url:
                  type: string
                  format: uri

/reservations/mobile-checkout-url:
  post:
    tags:
      - Reservations
    summary: Generar URL de checkout movil
    description: |
      Genera una URL especial que al abrirse en el navegador
      agrega automaticamente los productos al carrito y redirige a checkout.
    operationId: getMobileCheckoutUrl
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - date
              - tickets
            properties:
              date:
                type: string
                format: date
              tickets:
                type: array
                items:
                  type: object
    responses:
      '200':
        description: URL de checkout generada
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                checkout_url:
                  type: string
                  format: uri
                  description: URL con token para abrir en navegador
                expires_in:
                  type: integer
                  description: Segundos hasta expiracion

# -----------------------------------------------------------------------------
# CLIENTE - BILLETERA DE TICKETS
# -----------------------------------------------------------------------------

/client/my-reservations:
  get:
    tags:
      - Client Wallet
    summary: Mis reservas (billetera)
    description: |
      Devuelve las reservas del cliente autenticado por email verificado.
      Usado para la billetera de tickets en la app.
    operationId: getClientReservations
    parameters:
      - name: email
        in: query
        schema:
          type: string
          format: email
      - name: device_id
        in: query
        schema:
          type: string
      - name: include_past
        in: query
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Lista de reservas del cliente
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                reservations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      ticket_code:
                        type: string
                      ticket_name:
                        type: string
                      date:
                        type: string
                        format: date
                      status:
                        type: string
                        enum: [pendiente, usado, cancelado, expirado]
                      status_display:
                        type: string
                      qr_data:
                        type: string
                total:
                  type: integer

/client/reservation/{code}:
  get:
    tags:
      - Client Wallet
    summary: Detalle de reserva por codigo
    description: Obtiene los detalles de una reserva especifica por su codigo QR.
    operationId: getClientReservationByCode
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Detalle de la reserva
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                reservation:
                  type: object

/client/config:
  get:
    tags:
      - Client Wallet
    summary: Configuracion de app cliente
    description: Alias de /client-app-config para la app cliente.
    operationId: getClientConfig
    responses:
      '200':
        description: Configuracion de la app

# -----------------------------------------------------------------------------
# VERIFICACION DE EMAIL
# -----------------------------------------------------------------------------

/client/email/send-code:
  post:
    tags:
      - Email Verification
    summary: Enviar codigo de verificacion
    description: |
      Envia un codigo de 6 digitos al email del usuario para verificacion.
      Implementa rate limiting (max 3 envios cada 15 min).
    operationId: sendVerificationCode
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - device_id
            properties:
              email:
                type: string
                format: email
              device_id:
                type: string
    responses:
      '200':
        description: Codigo enviado
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                expires_in:
                  type: integer
                  description: Segundos hasta expiracion del codigo
      '429':
        description: Rate limit excedido

/client/email/verify-code:
  post:
    tags:
      - Email Verification
    summary: Verificar codigo de email
    description: |
      Verifica el codigo enviado por email.
      Maximo 5 intentos por codigo.
    operationId: verifyEmailCode
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - code
              - device_id
            properties:
              code:
                type: string
                pattern: '^\d{6}$'
              device_id:
                type: string
    responses:
      '200':
        description: Verificacion exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                email:
                  type: string
                verified_at:
                  type: string
                  format: date-time
      '400':
        description: Codigo invalido o expirado

/client/email/status:
  get:
    tags:
      - Email Verification
    summary: Estado de verificacion de email
    description: Consulta si el dispositivo tiene un email verificado.
    operationId: getEmailVerificationStatus
    parameters:
      - name: device_id
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Estado de verificacion
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                verified:
                  type: boolean
                email:
                  type: string
                  nullable: true
                verified_at:
                  type: string
                  format: date-time
                  nullable: true

# -----------------------------------------------------------------------------
# CLIENTE - DASHBOARD
# -----------------------------------------------------------------------------

/client/statistics:
