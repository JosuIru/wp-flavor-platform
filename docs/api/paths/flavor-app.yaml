              reason:
                type: string
    responses:
      '200':
        description: Reserva cancelada

/admin/reservations/find:
  get:
    tags:
      - Admin
    summary: Buscar reserva por codigo
    description: Busca una reserva por codigo de ticket (para escaneo QR).
    operationId: findReservationByCode
    security:
      - bearerAuth: []
    parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
