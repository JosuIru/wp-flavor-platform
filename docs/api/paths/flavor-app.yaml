        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      timestamp:
                        type: string
                      icon_name:
                        type: string
                      action_route:
                        type: string
                total:
                  type: integer

# -----------------------------------------------------------------------------
# ADMIN - DASHBOARD
# -----------------------------------------------------------------------------

/admin/dashboard:
  get:
    tags:
      - Admin
    summary: Dashboard de administrador
    description: |
      Devuelve metricas y estadisticas para el dashboard de admin.
      Requiere rol de administrador.
    operationId: getAdminDashboard
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Datos del dashboard
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                stats:
                  type: object
                  properties:
                    today_reservations:
                      type: integer
                    today_revenue:
                      type: number
                    pending_checkins:
                      type: integer
                    total_customers:
                      type: integer
                recent_reservations:
                  type: array
                  items:
                    type: object
      '403':
        description: No autorizado

/admin/reservations:
  get:
    tags:
      - Admin
    summary: Listar reservas (admin)
    description: Lista todas las reservas con filtros opcionales.
    operationId: getAdminReservations
    security:
      - bearerAuth: []
    parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: status
        in: query
        schema:
          type: string
          enum: [pendiente, usado, cancelado]
      - name: search
        in: query
        schema:
          type: string
    responses:
      '200':
        description: Lista de reservas
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                reservations:
                  type: array
                  items:
                    type: object
                total:
                  type: integer

/admin/reservations/{id}:
  get:
    tags:
      - Admin
    summary: Detalle de reserva
    description: Obtiene todos los detalles de una reserva especifica.
    operationId: getReservationDetail
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Detalle de la reserva
      '404':
        description: Reserva no encontrada

/admin/reservations/{id}/checkin:
  post:
    tags:
      - Admin
    summary: Realizar check-in
